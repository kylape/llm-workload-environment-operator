# Empty lets the operator detect OpenShift. Set coreweave explicitly for CKS.
platform: ""

image:
  repository: quay.io/klape/llm-workload-environment-operator
  tag: latest
  # A nonempty digest takes precedence over tag.
  digest: sha256:65edeeca54c5407093f5398c2fe7bb5f58c47a300bcb2966053609be84a3e164
  pullPolicy: IfNotPresent

replicaCount: 1
imagePullSecrets: []

argocd:
  # Empty disables registration. This chart does not install Argo CD.
  namespace: ""

kueue:
  # Main integration switch: false permits provisioning without Kueue installed.
  admissionEnabled: true
  # Only skips Pod integration/namespace selector validation; queues stay required.
  admissionValidationEnabled: true
  # Set this map to match the host Kueue policy. Empty applies no extra labels;
  # validation still requires Kueue to select each backing namespace.
  namespaceLabels: {}
  configRef: kueue-system:kueue-manager-config:controller_manager_config.yaml

crds:
  # CRDs are rendered as ordinary templates and updated during upgrade/sync.
  # Retention annotations protect them when disabled or moved elsewhere.
  create: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
