apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-workload-environment-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: llm-workload-environment-operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-workload-environment-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-workload-environment-operator
    spec:
      serviceAccountName: llm-workload-environment-operator
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ if .Values.image.digest }}{{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}{{ else }}{{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect
            - --metrics-bind-address=:8443
            - --health-probe-bind-address=:8081
          env:
            - name: PLATFORM
              value: {{ .Values.platform | quote }}
            - name: ARGOCD_NAMESPACE
              value: {{ .Values.argocd.namespace | quote }}
            - name: KUEUE_ADMISSION_ENABLED
              value: {{ .Values.kueue.admissionEnabled | toString | quote }}
            - name: KUEUE_NAMESPACE_LABELS
              value: {{ .Values.kueue.namespaceLabels | toJson | quote }}
            - name: KUEUE_CONFIG_REF
              value: {{ .Values.kueue.configRef | quote }}
          ports:
            - containerPort: 8081
              name: health
            - containerPort: 8443
              name: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 10
      volumes:
        - emptyDir: {}
          name: tmp
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
