apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-workload-environment-operator-builder
  namespace: llm-workload-environment-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-workload-environment-operator-builder-privileged
  namespace: llm-workload-environment-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: llm-workload-environment-operator-builder
    namespace: llm-workload-environment-operator
