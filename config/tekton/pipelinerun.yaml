apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: llm-workload-environment-operator-build-
  namespace: llm-workload-environment-operator
spec:
  params:
    - name: git-revision
      value: main
    - name: image
      value: quay.io/klape/llm-workload-environment-operator:latest
    - name: push-image
      value: "true"
  pipelineRef:
    name: llm-workload-environment-operator-build
  taskRunTemplate:
    serviceAccountName: llm-workload-environment-operator-builder
  timeouts:
    pipeline: 30m
  workspaces:
    - emptyDir: {}
      name: source
    - name: registry-auth
      secret:
        secretName: llm-workload-environment-operator-registry-auth
