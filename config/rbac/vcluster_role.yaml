apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llm-workload-environment-vcluster
rules:
  - apiGroups:
      - storage.k8s.io
    resources:
      - csistoragecapacities
      - storageclasses
    verbs:
      - get
      - list
      - watch
  # DRA sync: the syncer reads DeviceClasses from the host and syncs
  # ResourceClaims and ResourceClaimTemplates to the host.
  - apiGroups:
      - resource.k8s.io
    resources:
      - deviceclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceclaims
      - resourceclaimtemplates
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - update
      - patch
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceclaims/status
    verbs:
      - update
      - patch
