apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llm-workload-environment-requester
rules:
  - apiGroups:
      - llm.redhat.com
    resources:
      - llmworkloadenvironments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
