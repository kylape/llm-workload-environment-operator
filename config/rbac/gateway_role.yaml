# Grants environment credentials read and port-forward access to the shared
# inference gateway infrastructure. The operator binds this role, via a
# RoleBinding named "environment-gateway-access", in each configured gateway
# namespace (see GATEWAY_NAMESPACES) for every Namespace-mode environment, so
# tooling such as inference-e2e can resolve and reach the Gateway an
# LLMInferenceService routes through (services, gateway status, and
# port-forwarding to gateway pods).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llm-workload-environment-gateway-user
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/portforward
    verbs:
      - create
      - get
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
    verbs:
      - get
      - list
      - watch
