apiVersion: llm.redhat.com/v1alpha1
kind: LLMWorkloadEnvironment
metadata:
  name: hosted-example
  namespace: workload-requests
spec:
  mode: HyperShift
  duration: 168h
  # Required when the installation enables Kueue. The landing namespace must
  # allow this queue through llm.redhat.com/allowed-cluster-queues.
  clusterQueue: inference-workspaces
  hypershift:
    profile: default
    size: small
    replicas: 1
    # Optional: use a Docker config Secret from this LWE's namespace instead
    # of the administrator profile's pull Secret.
    # pullSecret:
    #   name: hosted-cluster-pull-secret
    imageDigestMirrorSet:
      imageDigestMirrors:
        - source: registry.redhat.io/rhoai
          mirrors:
            - quay.io/rhoai
          mirrorSourcePolicy: NeverContactSource
        - source: registry.redhat.io/rhaii
          mirrors:
            - registry.stage.redhat.io/rhaii
          mirrorSourcePolicy: NeverContactSource
        - source: registry.redhat.io/rhaii-early-access
          mirrors:
            - registry.stage.redhat.io/rhaii-early-access
          mirrorSourcePolicy: NeverContactSource
        - source: registry.redhat.io/rhaii-fast
          mirrors:
            - registry.stage.redhat.io/rhaii-fast
          mirrorSourcePolicy: NeverContactSource
