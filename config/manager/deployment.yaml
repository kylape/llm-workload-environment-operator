apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-workload-environment-operator
  namespace: llm-workload-environment-operator
  labels:
    app.kubernetes.io/name: llm-workload-environment-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-workload-environment-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-workload-environment-operator
    spec:
      serviceAccountName: llm-workload-environment-operator
      containers:
        - args:
            - --leader-elect
            - --metrics-bind-address=:8443
            - --health-probe-bind-address=:8081
          image: quay.io/klape/llm-workload-environment-operator:latest
          name: manager
          env:
            # Supported values are openshift and coreweave. OpenShift is auto-detected when unset.
            - name: PLATFORM
              value: ""
            # Optional: register labeled vClusters in this Argo CD namespace.
            # Empty disables registration; recorded registrations are cleaned up.
            - name: ARGOCD_NAMESPACE
              value: ""
            # Optional hosted OpenShift provisioning; see docs/hypershift.md.
            - name: HYPERSHIFT_CONFIG
              value: '{"enabled":false,"profiles":{}}'
            # Enable queue checks, LocalQueues, namespace labels, and validation.
            # Set false to provision environments without a Kueue dependency.
            - name: KUEUE_ADMISSION_ENABLED
              value: "true"
            # Validate Kueue Pod integration and namespace selection when enabled.
            - name: KUEUE_ADMISSION_VALIDATION_ENABLED
              value: "true"
            # JSON map; replaces the default label. For CKS, use
            # {"kueue.x-k8s.io/managed":"true"} when that matches host policy.
            - name: KUEUE_NAMESPACE_LABELS
              value: '{"kueue.openshift.io/managed":"true"}'
            # Host Kueue configuration reference: namespace:name:data-key.
            - name: KUEUE_CONFIG_REF
              value: kueue-system:kueue-manager-config:controller_manager_config.yaml
          ports:
            - containerPort: 8081
              name: health
            - containerPort: 8443
              name: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 10
      volumes:
        - emptyDir: {}
          name: tmp
